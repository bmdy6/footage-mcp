[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "footage-mcp"
version = "0.1.0"
description = "Free footage search for AI video agents: Pexels, Pixabay, Wikimedia Commons, Internet Archive, NASA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<3"]

[project.scripts]
footage-mcp = "footage_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["footage_mcp*"]
